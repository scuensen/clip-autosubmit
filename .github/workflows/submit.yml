name: whop-submit
on:
  schedule:
    # Posting 15/19/23 Uhr Wien (CEST = UTC+2) → mehrere Versuche im 30-Min-Fenster
    - cron: "3,9,15,21 13,17,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur bis zum Dialog (1 = ja)"
        default: ""
permissions:
  contents: write
concurrency: whop-submit
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm i
      - run: npx playwright install --with-deps chromium
      - run: node submit.mjs
        env:
          WHOP_COOKIES: ${{ secrets.WHOP_COOKIES }}
          DRY_RUN: ${{ inputs.dry_run }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: "fehler-*.png", if-no-files-found: ignore, retention-days: 3 }
      - if: always()
        run: |
          git config user.name "clip-bot"; git config user.email "clip-bot@users.noreply.github.com"
          git add submitted.json && git commit -m "eingereicht $(date -u +%FT%TZ)" && git push || true
