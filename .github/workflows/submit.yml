name: whop-submit
# Läuft als Kette: wartet bis zum nächsten Posting, reicht ein, startet sich vor dem 6-h-Limit selbst neu.
# Der Cron ist nur Absicherung, falls die Kette mal reißt (concurrency hält es bei einem Lauf + einem wartenden).
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur bis zum Dialog (1 = ja)"
        default: ""
      force_urls:
        description: "TikTok-Links sofort nachreichen (Leerzeichen getrennt)"
        default: ""
permissions:
  contents: write
  actions: write
# Nachreichen läuft getrennt, damit es nicht hinter der stundenlangen Kette wartet
concurrency: whop-submit${{ inputs.force_urls != '' && '-force' || '' }}
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm i
      - run: npx playwright install --with-deps chromium
      - name: Dry-Run
        if: inputs.dry_run == '1'
        run: node submit.mjs
        env:
          WHOP_COOKIES: ${{ secrets.WHOP_COOKIES }}
          DRY_RUN: "1"
      - name: Nachreichen
        if: inputs.force_urls != ''
        env:
          WHOP_COOKIES: ${{ secrets.WHOP_COOKIES }}
          FORCE_URLS: ${{ inputs.force_urls }}
        run: |
          git config user.name "clip-bot"; git config user.email "clip-bot@users.noreply.github.com"
          node submit.mjs
          git add submitted.json && git commit -qm "nachgereicht $(date -u +%FT%TZ)" && git pull -q --rebase && git push -q || true
      - name: Kette
        if: inputs.dry_run != '1' && inputs.force_urls == ''
        env:
          WHOP_COOKIES: ${{ secrets.WHOP_COOKIES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "clip-bot"; git config user.email "clip-bot@users.noreply.github.com"
          START=$(date +%s); LIMIT=$((340*60))
          while true; do
            git pull -q --rebase || true
            WAIT=$(node next.mjs)
            [ "$WAIT" = none ] && { echo "alles eingereicht, Kette endet"; exit 0; }
            LEFT=$((START + LIMIT - $(date +%s)))
            if [ "$WAIT" -ge "$LEFT" ]; then
              sleep $((LEFT > 0 ? LEFT : 0))
              gh workflow run whop-submit -R "$GITHUB_REPOSITORY" && echo "Kette weitergereicht"; exit 0
            fi
            echo "warte ${WAIT}s"; sleep "$WAIT"
            node submit.mjs || sleep 120   # Fehlschlag (z. B. Video noch nicht live) → in 2 Min nochmal, solange im Fenster
            git add submitted.json && git commit -qm "eingereicht $(date -u +%FT%TZ)" && git push -q || true
          done
